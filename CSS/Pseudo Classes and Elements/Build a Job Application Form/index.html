<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Job Application Form</h1>
        <form>
          <label for="name">Full Name:</label>
          <input type="text" id="name" placeholder="Enter your name"/>

          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="Enter your email"/>

          <label for="position">Position:</label>
          <select name="work" id="position">
            <option value="select-a-position" selected disabled>
              Select a position
            </option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Manager</option>
          </select>

          <fieldset id="radio-group" class=".radio-group">
            <legend>Availability:</legend>

            <input
              type="radio"
              name="availability"
              id="Full-Time" value="Full-Time"
              class="Full-Time" value="Full-Time"
            />
            <label for="Full-Time" class="Full-Time">Full-Time</label>

            <input
              type="radio"
              name="availability"
              id="Part-Time" value="Part-Time"
              class="Part-Time" value="Part-Time"
            />
            <label for="Part-Time" class="Part-Time">Part-Time</label>
          </fieldset>

          <label for="message">Why do you want this job?</label>
          <textarea name="job" id="message" cols="50" rows="4" placeholder="write your motivation"></textarea>

          <button type="submit">Submit Application</button>
        </form>
      </div>
    </main>
  </body>
</html>
