<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content">
      <main>
        <h1>My To-Do List</h1>
        <ul class="todo-list">
          <li class="item">
            <input type="checkbox" name="list" id="gaming" value="gaming" />
            <label for="gaming">Explore gaming keyboards</label>

            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link">Store link</a>
              </li>
            </ul>
          </li>

          <li class="item">
            <input type="checkbox" name="list" id="report" value="report" />
            <label for="report">Finish the report</label>
  
            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >Request Access</a
                >
              </li>
            </ul>
          </li>

          <li class="item">
            <input type="checkbox" name="list" id="Warranty" value="Warranty" />
            <label for="Warranty">View Phone's Warranty</label>

            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >View Receipts</a
                >
              </li>
            </ul>
          </li>

          <li class="item">
            <input
              type="checkbox"
              name="list"
              id="Processor "
              value="Processor "
            />
            <label for="Processor ">Check Processor Specst</label>

            <ul class="sub-item">
              <li>
                <a href="#" target="_blank" class="sub-item-link"
                  >View Model Number</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
