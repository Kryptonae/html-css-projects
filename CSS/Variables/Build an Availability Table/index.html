<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Availability Table</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th class="time" rowspan="2">9 AM</th>
          <td class="available-0 half">0</td>
          <td class="available-1 half">1</td>
          <td class="available-2 half">2</td>
          <td class="available-2 half">2</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-3 sharp">3</td>
          <td class="available-4 sharp">4</td>
          <td class="available-4 sharp">4</td>
          <td class="available-5 sharp">5</td>
          <td class="available-5 sharp">5</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">10 AM</th>
          <td class="available-3 half">3</td>
          <td class="available-4 half">4</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-0 sharp">0</td>
          <td class="available-2 sharp">2</td>
          <td class="available-4 sharp">4</td>
          <td class="available-4 sharp">4</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">11 AM</th>
          <td class="available-3 half">3</td>
          <td class="available-4 half">4</td>
          <td class="available-1 half">1</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-5 sharp">5</td>
          <td class="available-5 sharp">5</td>
          <td class="available-2 sharp">2</td>
          <td class="available-1 sharp">1</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">12 PM</th>
          <td class="available-3 half">3</td>
          <td class="available-0 half">0</td>
          <td class="available-4 half">4</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-1 sharp">1</td>
          <td class="available-3 sharp">3</td>
          <td class="available-3 sharp">3</td>
          <td class="available-2 sharp">2</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">1 PM</th>
          <td class="available-3 half">3</td>
          <td class="available-0 half">0</td>
          <td class="available-4 half">4</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-5 sharp">5</td>
          <td class="available-5 sharp">5</td>
          <td class="available-2 sharp">2</td>
          <td class="available-1 sharp">1</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">2 PM</th>
          <td class="available-3 half">3</td>
          <td class="available-4 half">4</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-0 sharp">0</td>
          <td class="available-2 sharp">2</td>
          <td class="available-4 sharp">4</td>
          <td class="available-4 sharp">4</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">3 PM</th>
          <td class="available-3 half">3</td>
          <td class="available-0 half">0</td>
          <td class="available-4 half">4</td>
          <td class="available-5 half">5</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-0 sharp">0</td>
          <td class="available-2 sharp">2</td>
          <td class="available-4 sharp">4</td>
          <td class="available-4 sharp">4</td>
          <td class="available-0 sharp">0</td>
        </tr>

        <tr>
          <th class="time" rowspan="2">4 PM</th>
          <td class="available-0 half">0</td>
          <td class="available-1 half">1</td>
          <td class="available-2 half">2</td>
          <td class="available-2 half">2</td>
          <td class="available-5 half">5</td>
        </tr>
        <tr>
          <td class="available-0 sharp">0</td>
          <td class="available-2 sharp">2</td>
          <td class="available-4 sharp">4</td>
          <td class="available-4 sharp">4</td>
          <td class="available-0 sharp">0</td>
        </tr>
      </tbody>
    </table>

    <div id="legend">
        <span id="legend-gradient">Availability</span>
      </div>
  </body>
</html>
