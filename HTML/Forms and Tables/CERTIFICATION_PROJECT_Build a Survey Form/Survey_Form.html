<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>
  <body>
    <header>
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">
        Thank you for taking the time to help us improve the platform
      </p>
    </header>

    <main>
      <form id="survey-form">
        <label for="name" id="name-label">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
          size="20"
        />
        <label for="email" id="email-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your Email"
          required
          size="20"
        />
        <label for="number" id="number-label">Age(optional)</label>
        <input
          type="number"
          id="number"
          name="number"
          min="3"
          max="100"
          placeholder="Age"
        />

        <label for="role">Which option best describes your current role?</label>
        <select name="role" id="dropdown">
          <option value="select-current-role" disabled selected>
            Select current role
          </option>
          <option value="student">Student</option>
          <option value="full-time-job">Full Time Job</option>
          <option value="full-time-learner">Full Time Learner</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
          <option value="others">Others</option>
        </select>

        <input type="radio" name="select" id="Definitely" value="Definitely" />
        <label for="Definitely">Definitely</label>
        <input type="radio" name="select" id="maybe" value="maybe" />
        <label for="maybe">Maybe</label>
        <input type="radio" name="select" id="not-sure" value="not-sure" />
        <label for="not-sure">Not sure</label>

        <label for="feature">
          What is your favorite feature of freeCodeCamp?
        </label>
        <select name="feature" id="feature">
          <option value="select-an-option" disabled selected>
            Select an option
          </option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="openSource">Open Source</option>
        </select>

        <label for="improved">
          What would you like to see improved? (Check all that apply)
        </label>
        <input
          type="checkbox"
          name="choose"
          id="front-end-projects"
          value="front-end-projects"
        />
        <label for="front-end-projects"> front-end-projects </label>
        <input
          type="checkbox"
          name="choose"
          id="back-end-projects"
          value="back-end-projects"
        />
        <label for="back-end-projects"> Back-end Projects </label>
        <input
          type="checkbox"
          name="choose"
          id="Data-visualization"
          value="Data-visualization"
        />
        <label for="Data-visualization"> Data Visualization </label>
        <input
          type="checkbox"
          name="choose"
          id="challenges"
          value="challenges"
        />
        <label for="challenges"> Challenges</label>
        <input
          type="checkbox"
          name="choose"
          id="open-source-community"
          value="open-source-community"
        />
        <label for="open-source-community">Open Source Commmunity</label>
        <input
          type="checkbox"
          name="choose"
          id="gitter-help-rooms"
          value="gitter-help-rooms"
        />
        <label for="gitter-help-rooms">Gitter help rooms</label>
        <input type="checkbox" name="choose" id="videos" value="videos" />
        <label for="videos">Videos</label>
        <input
          type="checkbox"
          name="choose"
          id="city-meetups"
          value="city-meetups"
        />
        <label for="city-meetups">City Meetups</label>
        <input type="checkbox" name="choose" id="wiki" value="wiki" />
        <label for="wiki">Wiki </label>
        <input type="checkbox" name="choose" id="forum" value="forum" />
        <label for="forum">Forum</label>
        <input
          type="checkbox"
          name="choose"
          id="additional-courses"
          value="additional-courses"
        />
        <label for="additional-courses">Additional Courses</label>

        <label for="comments">Any comments or suggestions?</label>
        <textarea
          name="comments"
          id="comments"
          cols="30"
          rows="5"
          placeholder="Enter your comment here..."
        ></textarea>

        <button type="submit" id="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
