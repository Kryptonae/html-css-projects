<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playing Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <p>A</p>
          <p>♠</p>
        </div>
        <div class="middle">
          <p class="middle-big">♠</p>
        </div>
        <div class="right">
          <p class="rotate">A</p>
          <p class="rotate">♠</p>
        </div>
      </div>

      <div class="card">
        <div class="left">
          <p>2</p>
          <p>♣</p>
        </div>
        <div class="middle">
          <p class="middle-big">♣</p>
          <p class="middle-big rotated">♣</p>
        </div>
        <div class="right">
          <p class="rotate">2</p>
          <p class="rotate">♣</p>
        </div>
      </div>

      <div class="card red">
        <div class="left">
          <p>3</p>
          <p>♥</p>
        </div>
        <div class="middle">
          <p class="middle-big">♥</p>
          <p class="middle-big">♥</p>
          <p class="middle-big rotated">♥</p>
        </div>
        <div class="right">
          <p class="rotate">3</p>
          <p class="rotate">♥</p>
        </div>
      </div>
      
      <div class="card">
        <div class="left">
          <p>4</p>
          <p>♣</p>
        </div>
        <div class="middle row">
          <p class="middle-big -flip">♣</p>
          <p class="middle-big-flip">♣</p>
        </div>
        <div class="middle row">
          <p class="middle-big">♣</p>
          <p class="middle-big-flip">♣</p>
        </div>
        <div class="right">
          <p class="rotate">4</p>
          <p class="rotate">♣</p>
        </div>
      </div>
    </main>
  </body>
</html>
